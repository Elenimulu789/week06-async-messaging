services:
  rabbitmq:
    image: rabbitmq:4.2-management
    hostname: week06-broker
    environment:
      RABBITMQ_DEFAULT_USER: classroom
      RABBITMQ_DEFAULT_PASS: classroom-local-only
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbit-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  api:
    build: .
    environment:
      AMQP_URL: amqp://classroom:classroom-local-only@rabbitmq:5672/%2F
    ports:
      - "127.0.0.1:8006:8000"
    volumes:
      - job-data:/app/data
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: .
    command: ["python", "-m", "src.worker"]
    environment:
      AMQP_URL: amqp://classroom:classroom-local-only@rabbitmq:5672/%2F
    volumes:
      - job-data:/app/data
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  rabbit-data:
  job-data:
