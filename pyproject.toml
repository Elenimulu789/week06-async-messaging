[project]
name = "week06-async-messaging"
version = "0.1.0"
description = "Durable asynchronous report jobs with FastAPI and RabbitMQ"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.30,<1",
  "pika>=1.3,<2",
  "httpx>=0.27,<1",
]
[dependency-groups]
dev = ["pytest>=8,<10"]
[tool.pytest.ini_options]
testpaths = ["tests"]
